<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seatwork 1</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --button-bg: #000000;
            --button-text: #ffffff;
            --button-hover: #333333;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        main {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 360px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 1.75rem 0;
            text-align: center;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            font-size: 0.95rem;
            background: transparent;
            color: var(--text-color);
            border: 1.5px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #888888;
        }

        input:focus {
            outline: none;
            border-color: #000000;
            box-shadow: 0 0 0 1px #000000;
        }

        button {
            width: 100%;
            padding: 0.85rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--button-text);
            background-color: var(--button-bg);
            border: 1.5px solid #000000;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: #ffffff;
            color: #000000;
        }

        #output {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 1.5rem;
            text-align: center;
            min-height: 1.5rem;
        }
    </style>

    <script type="py" src="main.py"></script>
</head>
<body>

    <main>
        <h1>Candidate Verification System</h1>

        <div class="form-group">
            <label for="First_name">First Name</label>
            <input type="text" id="First_name" placeholder="Ex: Andre">
        </div>

        <div class="form-group">
            <label for="Last_name">Last Name</label>
            <input type="text" id="Last_name" placeholder="Ex: Pagud">
        </div>

        <button py-click="generate_result">Check Candidate</button>

        <h2 id="output"></h2>
    </main>

</body>
</html>
